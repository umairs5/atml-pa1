seed: 6304

data:
  root: data/pacs/PACS_Original
  protocol: shared/splits/pacs_sketch_seed6304.json
  source_domains: [photo, art_painting, cartoon]
  classes: [dog, elephant, giraffe, guitar, horse, house, person]
  resize_size: 256
  crop_size: 224
  num_workers: 2

training:
  source_per_domain: 8
  max_epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 5

model:
  backbone: resnet18
  weights: IMAGENET1K_V1
  freeze_batch_norm_statistics: true

output:
  root: task3/results
