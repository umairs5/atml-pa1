seed: 6304
dataset:
  name: STL10
  root: data/stl10
  download: true
  validation_fraction: 0.20
  test_images_per_class: 50
image:
  size: 224
  interpolation: bicubic
color_interventions:
  hue_factor: 0.25
  additional_color_name: hue_rotation_90_degrees
spatial_interventions:
  translation_displacements: [0, 8, 16, 32]
  patch_grid_size: 4
cue_conflicts:
  adain_input_size: 256
  alpha: 1.0
  candidates_per_direction: 25
  selected_per_direction: 20
  pairs:
    - [cat, dog]
    - [deer, horse]
    - [bird, cat]
    - [horse, dog]
    - [bird, dog]
training:
  feature_batch_size: 64
  head_batch_size: 128
  num_workers: 2
  max_epochs: 50
  patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
models:
  - resnet50
  - vit_b_16
  - clip_vit_b_32
output:
  split_path: task1/data/splits/stl10_seed6304.json
  metrics_path: task1/results/metrics/clean_baseline.json
  color_metrics_path: task1/results/metrics/color_interventions.json
  color_table_path: task1/results/metrics/color_interventions.csv
  spatial_metrics_path: task1/results/metrics/spatial_interventions.json
  spatial_table_path: task1/results/metrics/spatial_interventions.csv
  cue_candidate_dir: task1/results/cue_conflicts
  checkpoint_dir: task1/results/checkpoints
